name: Instagram paylaşımı

# Panelden planlanan Reels videolarını saati gelince resmi Instagram API ile paylaşır.
# INSTAGRAM_TOKEN secret'ı yoksa hiçbir şey yapmadan biter. Saati gelen gönderi yoksa
# Instagram'a istek atılmaz (haftalık token yenilemesi hariç).
# GitHub zamanlanmış görevleri birkaç dakika (yoğunlukta 15-30 dk) gecikebilir.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # ffmpeg yalnızca saati gelmiş ve düzenlenecek bir video varsa kurulur (her çalışmada değil).
      - name: Video düzenleme gerekiyor mu
        id: kontrol
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: echo "gerekli=$(python -m urun_bulucu.instagram --ffmpeg-gerekli)" >> "$GITHUB_OUTPUT"
      - name: ffmpeg kur
        if: steps.kontrol.outputs.gerekli == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          fi
          ffmpeg -hide_banner -version | head -1
      - name: Saati gelen gönderileri paylaş
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: python -m urun_bulucu.instagram
